<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Element</title>
</head>
<body>
    <form action="">
        <label for="fname">First name</label>
      <input type="text" id="fname" name="fname" placeholder="first name">
<br>
        <label for="fname">Midel name</label>
      <input type="text" id="mname" name="mname" placeholder="midel name"> 
      <br>
      <label for="lname"> Last name</label>
      <input type="text" id="lname" name="lname" placeholder="first name">
      <br>
      <label for="fruits">Choose a fruit</label>

      <select name="fruits" id="fruits">
        <option value="Apple">Apple</option>
        <option value="Strawberries">Strawberries</option>
        <option value="Pineapple" selected>Pineapple</option>
        <option value="Grape">Grape</option>
        <option value="Mango">Mango</option>
        <option value="Banana">Banana</option>
        <option value="Orange" >Orange</option>
      </select>

   <!-- Visible Values: Use the size attribute to specify the number of visible values:
     Example -->
    <label for="cars">Choose a car:</label>
    <select id="cars" name="cars" size="3">
      <option value="volvo">Volvo</option>
      <option value="saab">Saab</option>
      <option value="fiat">Fiat</option>
      <option value="audi">Audi</option>
    </select>
    <!-- Allow Multiple Selections:Use the multiple attribute to allow the user to select more than one value:
Example -->
<label for="cars">Choose a car:</label>
<select id="cars" name="cars" size="4" multiple>
  <option value="volvo">Volvo</option>
  <option value="saab">Saab</option>
  <option value="fiat">Fiat</option>
  <option value="audi">Audi</option>
</select>
<br>
<label for="textarea">Discribe about you</label>
<textarea name="message" id="textarea" rows="10" cols="30">
    </textarea>
    <br>
    <fieldset>
        <legend>About me
        </legend> <br>
            <label for="fname">First name</label>
            <input type="text" id="fname" name="fname" value="Abhishek"><br>
              <label for="fname">Middel name</label>
            <input type="text" id="mname" name="mname" value="J"><br> 
             <label for="lname">Last name</label>
            <input type="text" id="lname" name="lname" value="Mehata"><br>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
          <!-- <button>reset</button> -->
    </fieldset>
    
     </form>
</body>
